<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620">
  <defs>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #111; }
      .label { font: 600 13px system-ui, sans-serif; fill: #111; }
      .small { font: 12px system-ui, sans-serif; fill: #333; }
      .note  { font: 11px system-ui, sans-serif; fill: #555; }
      .box   { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; rx: 8; }
      .box-core { fill: #e0f2fe; stroke: #0369a1; stroke-width: 1.5; rx: 8; }
      .box-ext  { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 3; rx: 8; }
      .arrow { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 4 3; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#334155"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="460" y="36" text-anchor="middle" class="title">PSS Architecture (v0.7)</text>

  <!-- Main flow boxes -->
  <rect x="40"  y="70" width="130" height="44" class="box-core"/>
  <text x="105" y="97" text-anchor="middle" class="label">Builder</text>

  <rect x="220" y="70" width="180" height="44" class="box-core"/>
  <text x="310" y="97" text-anchor="middle" class="label">ProblemSpecification</text>

  <rect x="450" y="70" width="120" height="44" class="box-core"/>
  <text x="510" y="97" text-anchor="middle" class="label">Adapter</text>

  <rect x="620" y="70" width="160" height="44" class="box"/>
  <text x="700" y="97" text-anchor="middle" class="label">LLM / Human / Agent</text>

  <!-- Arrows main flow -->
  <path d="M170 92 H215" class="arrow"/>
  <path d="M400 92 H445" class="arrow"/>
  <path d="M570 92 H615" class="arrow"/>

  <!-- Spec internal structure (left panel) -->
  <rect x="30" y="150" width="250" height="320" class="box" fill="#f1f5f9"/>
  <text x="155" y="175" text-anchor="middle" class="label">ProblemSpecification</text>
  <text x="50" y="205" class="small">→ Identity</text>
  <text x="50" y="228" class="small">→ Objective</text>
  <text x="50" y="251" class="small">→ Constraints</text>
  <text x="50" y="274" class="small">→ Scope</text>
  <text x="50" y="297" class="small">→ Knowledge</text>
  <text x="70" y="317" class="note">  Observation / Inference</text>
  <text x="70" y="335" class="note">  Assumption / Unknown</text>
  <text x="50" y="360" class="small">→ ThinkingProfile</text>
  <text x="50" y="383" class="small">→ Behavior (executable rules)</text>
  <text x="50" y="406" class="small">→ Output</text>
  <text x="50" y="429" class="small">→ Evaluation</text>
  <text x="50" y="452" class="small">→ PhaseState</text>

  <!-- Validation flow -->
  <rect x="340" y="180" width="140" height="40" class="box-core"/>
  <text x="410" y="205" text-anchor="middle" class="label">Validator</text>

  <rect x="340" y="250" width="140" height="40" class="box"/>
  <text x="410" y="275" text-anchor="middle" class="label">Findings</text>

  <rect x="340" y="320" width="140" height="40" class="box-core"/>
  <text x="410" y="345" text-anchor="middle" class="label">Fix Planner</text>

  <rect x="340" y="390" width="140" height="40" class="box"/>
  <text x="410" y="415" text-anchor="middle" class="label">Fix Plan</text>

  <!-- arrows validation -->
  <path d="M310 92 V200 H340" class="arrow"/>
  <path d="M410 220 V250" class="arrow"/>
  <path d="M410 290 V320" class="arrow"/>
  <path d="M410 360 V390" class="arrow"/>

  <!-- Executor external -->
  <rect x="560" y="390" width="150" height="50" class="box-ext"/>
  <text x="635" y="412" text-anchor="middle" class="label">Executor</text>
  <text x="635" y="430" text-anchor="middle" class="note">(External)</text>

  <path d="M480 410 H555" class="arrow dashed"/>

  <!-- Core boundary note -->
  <rect x="30" y="500" width="860" height="90" class="box" fill="#f8fafc"/>
  <text x="50" y="525" class="label">Design notes</text>
  <text x="50" y="548" class="small">• Validator and Fix Planner never mutate the specification</text>
  <text x="50" y="568" class="small">• Executor / CLI / IDE integrations live outside the core library</text>
  <text x="50" y="588" class="small">• Core = Specification + Builder + Adapter + Validator + Fix Planner</text>
</svg>
